{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block page %}
<div class="error-page"><div>
  <b>{{ code }}</b>
  <p>{{ "You don't have access to that page." if code == 403 else "We couldn't find that page." }}</p>
  <a class="btn" href="{{ url_for('home') }}">Go back home</a>
</div></div>
{% endblock %}
