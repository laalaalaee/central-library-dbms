{% extends "auth.html" %}
{% import "macros.html" as ui %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Become a member</h1>
<p>Borrow up to {{ MAX_LOANS }} books at a time for {{ LOAN_DAYS }} days each.</p>
<form method="post">
  <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" value="{{ request.form.name }}" required autofocus></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" value="{{ request.form.email }}" required></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><div class="hint">At least 6 characters.</div></div>
  <button class="btn primary block">Create account</button>
</form>
<p class="auth-alt">Already a member? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
